name: ops-admin

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: ops-admin-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ops_admin}
      MYSQL_USER: ${MYSQL_USER:-ops_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - ops-admin-mysql-data:/var/lib/mysql
    networks:
      - ops-admin
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ops-admin-api:local
    container_name: ops-admin-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OPS_ADMIN_JWT_SECRET: ${OPS_ADMIN_JWT_SECRET:?set OPS_ADMIN_JWT_SECRET in deploy/.env}
      OPS_ADMIN_INITIAL_USERNAME: ${OPS_ADMIN_INITIAL_USERNAME:-admin}
      OPS_ADMIN_INITIAL_PASSWORD: ${OPS_ADMIN_INITIAL_PASSWORD:?set OPS_ADMIN_INITIAL_PASSWORD in deploy/.env}
      OPS_ADMIN_CORS_ORIGINS: ${OPS_ADMIN_CORS_ORIGINS:-}
    volumes:
      - ./deploy/config.yaml:/app/config.yaml:ro
      - ops-admin-uploads:/app/uploads
      - ops-admin-data:/app/data
    networks:
      - ops-admin
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ops-admin-web:local
    container_name: ops-admin-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8080:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ops-admin
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  ops-admin:
    name: ops-admin-network

volumes:
  ops-admin-data:
  ops-admin-mysql-data:
    name: ops-admin-mysql-data
  ops-admin-uploads:
    name: ops-admin-uploads
